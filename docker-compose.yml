version: "3.9"

services:
  db:
    container_name: db
    image: postgres:15
    env_file:
      - .env
    #changed bindmount (./db/postgres-data:/var/lib/postgresql/data) to named volume 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped 

  #redis keeps teporary events, in RAM (exist just during the session, doesnt keep dasta on phisical folder)
  redis:
    container_name: redis
    image:  redis:7
    restart: unless-stopped

  backend:
    container_name: backend
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on: 
      - db
    # ports:
    #   - "8000:8000"
    #add_later tha db has to eait portgerSQL (healthcheck) 
    restart: unless-stopped
  
  # websocket:
  #   container_name: websocket
  #   build: ./websocket
  #   env_file:
  #     - .env
  #   depends_on:
  #     - backend
  #     - redis
  #   #Django channels need (wait for migrations and creation of db from backeand)
  #   restart: unless-stopped

  frontend:
    container_name: frontend
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: 
      - backend
    restart: unless-stopped


  nginx:
    container_name: nginx
    #image: nginx:alpine
    build: ./nginx
    depends_on: 
      - frontend
      - backend
    volumes: 
      # - ./nginx:/etc/nginx/conf.d
      # - ./nginx/certs:/etc/nginx/certs
      - ./backend/media:/media
    ports: 
      - "5001:443"
      - "5000:80"
    restart: unless-stopped

volumes:
  postgres_data: