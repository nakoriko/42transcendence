version: "3.9"

services:
  db:
    container_name: db
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped 

  #redis keeps teporary events, in RAM (exist just during the session, doesnt keep dasta on phisical folder)
  redis:
    container_name: redis
    image:  redis:7
    restart: unless-stopped

  backend:
    container_name: backend
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on: 
      - db
    #add_later tha db has to eait portgerSQL (healthcheck) 
    restart: unless-stopped

  frontend:
    container_name: frontend
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: 
      - backend
    restart: unless-stopped


  nginx:
    container_name: nginx
    build: ./nginx
    depends_on: 
      - frontend
      - backend
    volumes: 
      - ./backend/media:/media
      - ./backend/staticfiles:/static:ro
    ports: 
      - "5001:443"
      - "5000:80"
    restart: unless-stopped

volumes:
  postgres_data: