server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    #frontend
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;

        #for Vite HRM 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        #to keep connection alays open for events:
        proxy_set_header Connection "upgrade";
    }

    #backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr; #variable nginx to keep real IP of browser (for Django)
    }

    # media files(avatars) served directly from the volume mounted in docker-compose
    location /media/ {
        alias /media/;
    }

    #backend jango admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr; #variable nginx to keep real IP of browser (for Django)

    }

    #websocket
    location /ws/ {
        proxy_pass http://backend:8000; #all requests for /ws/ goes to backend, same as everything upper
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

#redirect from http to https
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}